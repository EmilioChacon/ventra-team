<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipo 403 - Alicante Futura Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-sans: 'Manrope', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --bg-color: #f8f9fa;
      --text-color: #212529;
      --header-bg: rgba(248, 249, 250, 0.85);
      --card-bg: #ffffff;
      --card-border: #e9ecef;
      --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      --accent-color: #0d6efd;
      --accent-text: #ffffff;
      --link-color: #0d6efd;
      --logo-main: #000;
      --logo-sub: #6c757d;
      --switcher-color: #495057;
    }

    html[data-theme='dark'] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --header-bg: rgba(18, 18, 18, 0.85);
      --card-bg: #1e1e1e;
      --card-border: #333;
      --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      --accent-color: #00aaff;
      --accent-text: #121212;
      --link-color: #00aaff;
      --logo-main: #fff;
      --logo-sub: #888;
      --switcher-color: #e0e0e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-sans);
      transition: background-color 0.3s, color 0.3s;
    }

    /* Solución "Bandana Fea": Agrupamos header y nav en un solo contenedor sticky */
    .sticky-wrapper {
      position: sticky;
      top: 0;
      width: 100%;
      z-index: 100;
      background-color: var(--header-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      transition: background-color 0.3s, border-color 0.3s;
    }

    .header-content {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem;
    }
    .logo { font-weight: 800; font-size: 1.25rem; white-space: nowrap; }
    .logo-main { color: var(--logo-main); }
    .logo-separator { color: var(--accent-color); padding: 0 0.5rem; }
    .logo-sub { color: var(--logo-sub); font-weight: 400; }

    .theme-switcher {
      background: none; border: none; cursor: pointer;
      color: var(--switcher-color); width: 24px; height: 24px; flex-shrink: 0;
    }
    .theme-switcher svg { width: 100%; height: 100%; }
    .moon-icon { display: none; }
    .sun-icon { display: block; }
    html[data-theme='dark'] .moon-icon { display: block; }
    html[data-theme='dark'] .sun-icon { display: none; }

    /* Nav rápida tipo "Historias de Instagram" para que quepan todos */
    .quick-nav {
      display: none;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 1rem 1rem;
    }

    .quick-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      background: none;
      border: none;
      color: var(--text-color);
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .nav-avatar-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid transparent;
      padding: 2px;
      transition: all 0.2s ease;
    }

    .quick-nav-btn:hover .nav-avatar-wrapper {
      border-color: var(--accent-color);
      transform: scale(1.05);
    }

    .nav-avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
    }
    .nav-avatar-wrapper img[src*="Santi.jpeg"] { object-position: center 20%; }

    .page-shell { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }
    .team-grid { display: grid; gap: 1.5rem; grid-template-columns: repeat(3, 1fr); }

    .team-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: var(--card-shadow);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      scroll-margin-top: 160px; /* Aumentado por el header unificado */
    }
    .team-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    html[data-theme='dark'] .team-card:hover { box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3); }

    .avatar {
      width: 100px; height: 100px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      overflow: hidden;
      border: 3px solid var(--card-border);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .avatar img[src*="Santi.jpeg"] { object-position: center 20%; }

    .team-name { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .role-badge {
      display: inline-block; font-family: var(--font-mono); font-size: 0.75rem;
      padding: 0.25rem 0.5rem; border-radius: 4px; margin-bottom: 1rem;
      background-color: var(--accent-color); color: var(--accent-text); font-weight: 500;
    }
    .team-links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .team-link {
      color: var(--link-color); text-decoration: none;
      border: 1px solid var(--card-border);
      padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.875rem;
      transition: all 0.2s ease;
    }
    .team-link:hover { background-color: var(--link-color); color: var(--accent-text); border-color: var(--link-color); }

    @media (max-width: 1024px) { .team-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) {
      .header-content { padding: 1rem 1rem 0.5rem 1rem; }
      .logo { font-size: 0.85rem; }
      .quick-nav { display: flex; }
      .team-grid { grid-template-columns: 1fr; }
      .page-shell { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

  <div class="sticky-wrapper">
    <header class="site-header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-main">EQUIPO 403</span>
          <span class="logo-separator">/</span>
          <span class="logo-sub">Alicante Futura Lab</span>
        </div>
        <button id="theme-switcher" class="theme-switcher" aria-label="Cambiar tema">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.106a.75.75 0 010 1.06l-1.591 1.59a.75.75 0 11-1.06-1.06l1.59-1.59a.75.75 0 011.06 0zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 011.06 0l1.59 1.59a.75.75 0 01-1.06 1.06l-1.59-1.59a.75.75 0 010-1.06zM12 21.75a.75.75 0 01-.75-.75v-2.25a.75.75 0 011.5 0v2.25a.75.75 0 01-.75.75zM5.106 17.834a.75.75 0 010-1.06l1.59-1.59a.75.75 0 111.06 1.06l-1.59 1.59a.75.75 0 01-1.06 0zM3 12a.75.75 0 01.75-.75h2.25a.75.75 0 010 1.5H3.75A.75.75 0 013 12zM6.106 5.106a.75.75 0 011.06 0l1.59 1.59a.75.75 0 01-1.06 1.06L6.106 6.166a.75.75 0 010-1.06z"/></svg>
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 004.463-.948.75.75 0 01.976.976A11.25 11.25 0 0112 21a11.25 11.25 0 01-11.25-11.25 11.25 11.25 0 019.528-9.282z" clip-rule="evenodd" /></svg>
        </button>
      </div>
    </header>

    <nav id="quick-nav" class="quick-nav" aria-label="Navegación rápida de miembros"></nav>
  </div>

  <main class="page-shell">
    <section id="team-container" class="team-grid" aria-label="Equipo 403"></section>
  </main>

  <script>
    const teamMembers = [
      { id: 'emilio', nombre: 'Emilio De La Peña Chacón', rol: 'SCRUM & Backend', github: 'https://github.com/EmilioChacon', linkedin: 'https://www.linkedin.com/in/emilio-dlp-chacon/', portfolio: 'https://emiliochacon.dev/', imagen: 'emilio.jpeg' },
      { id: 'santiago', nombre: 'Santiago Regidor', rol: 'Frontend Dev', linkedin: '#', cv: 'CV_Santiago.pdf', imagen: 'Santi.jpeg' },
      { id: 'rafael', nombre: 'Rafael Sánchez', rol: 'Fullstack Dev', github: 'https://github.com/KingMapachelo', linkedin: 'https://www.linkedin.com/in/rafael-s%C3%A1nchez-mart%C3%ADnez-0077b23b3/', cv: 'CVRafaelSanchez.pdf', imagen: 'RafaelSanchez.jpg' },
      { id: 'javier', nombre: 'Javier Galán', rol: 'Backend Dev', github: 'https://github.com/JavGalGas', linkedin: 'https://www.linkedin.com/in/javier-galan-360748351/', imagen: 'javier.jpg' },
      { id: 'sonia', nombre: 'Sonia Perez', rol: 'Fullstack Dev', github: 'https://github.com/soniaaperez', linkedin: 'https://www.linkedin.com/in/sonia-pérez-simarro-032098331', portfolio: 'https://soniaperezsimarro.vercel.app', cv: 'CV_Sonia.pdf', imagen: 'sonia.jpg' }
    ];

    const teamContainer = document.getElementById('team-container');
    const quickNav = document.getElementById('quick-nav');
    const themeSwitcher = document.getElementById('theme-switcher');

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    }

    themeSwitcher.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    function createLink(label, href) {
      const anchor = document.createElement('a');
      anchor.className = 'team-link';
      anchor.href = href;
      anchor.target = '_blank';
      anchor.rel = 'noreferrer noopener';
      anchor.textContent = label;
      return anchor;
    }

    function renderUI() {
      const cardFragment = document.createDocumentFragment();
      const navFragment = document.createDocumentFragment();

      teamMembers.forEach(member => {
        // 1. Crear Botón de Nav Rápida (Estilo Historias Instagram)
        const navBtn = document.createElement('button');
        navBtn.className = 'quick-nav-btn';
        navBtn.title = `Ir a ${member.nombre}`;
        navBtn.addEventListener('click', () => {
          document.getElementById(member.id).scrollIntoView({ behavior: 'smooth' });
        });

        const avatarWrapper = document.createElement('div');
        avatarWrapper.className = 'nav-avatar-wrapper';

        if (member.imagen) {
          const navImg = document.createElement('img');
          navImg.src = member.imagen;
          navImg.alt = member.nombre;
          avatarWrapper.appendChild(navImg);
        }
        navBtn.appendChild(avatarWrapper);

        const navName = document.createElement('span');
        navName.textContent = member.nombre.split(' ')[0]; // Extrae el primer nombre
        navBtn.appendChild(navName);

        navFragment.appendChild(navBtn);

        // 2. Crear Tarjeta del Equipo
        const card = document.createElement('article');
        card.className = 'team-card';
        card.id = member.id;

        const avatarContainer = document.createElement('div');
        avatarContainer.className = 'avatar';
        if (member.imagen) {
          const image = document.createElement('img');
          image.src = member.imagen;
          image.alt = `Foto de perfil de ${member.nombre}`;
          avatarContainer.appendChild(image);
        }

        const name = document.createElement('h2');
        name.className = 'team-name';
        name.textContent = member.nombre;

        const roleBadge = document.createElement('span');
        roleBadge.className = 'role-badge';
        roleBadge.textContent = member.rol;

        const links = document.createElement('div');
        links.className = 'team-links';
        if (member.github) links.appendChild(createLink('GitHub', member.github));
        if (member.linkedin) links.appendChild(createLink('LinkedIn', member.linkedin));
        if (member.portfolio) links.appendChild(createLink('Portfolio', member.portfolio));
        if (member.cv) links.appendChild(createLink('CV', member.cv));

        card.appendChild(avatarContainer);
        card.appendChild(name);
        card.appendChild(roleBadge);
        card.appendChild(links);
        cardFragment.appendChild(card);
      });

      quickNav.appendChild(navFragment);
      teamContainer.appendChild(cardFragment);
    }

    initTheme();
    renderUI();
  </script>
</body>
</html>
